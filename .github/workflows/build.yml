name: Build
on:
  pull_request:
  push:
    branches:
      - main
jobs:
  build:
    name: Build
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    env:
      # https://github.com/NuGet/Home/issues/11548
      # https://twitter.com/xoofx/status/1488617114940452872?s=20&t=BKSN4j9rP6fOyg8l7aW0eg
      NUGET_CERT_REVOCATION_MODE: offline
    steps:
      - name: Get Source
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install .NET Core SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x
      - name: Build
        run: dotnet build buildalyzer.slnx
      # One test project at a time: the suites build the same fixture projects under tests/projects in
      # place, and two of them building one project at once race on its obj directory (on Windows, a reader
      # sees "access denied" for a file the other build is rewriting). Not `dotnet test -m:1`, which runs the
      # test host from the CLI's own MSBuild process and makes the suites several times slower.
      - name: Test
        shell: bash
        run: |
          status=0
          for project in tests/*.Tests; do
            dotnet test "$project" --no-build --logger "trx;LogFileName=test-results.trx" || status=1
          done
          exit $status
      - name: Upload Test Results
        uses: actions/upload-artifact@v4
        if: success() || failure()
        with:
          name: test-results-${{ matrix.os }}
          path: '**/test-results.trx'
